<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>primore reps // luxury store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #fff; color: #000; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eee; text-transform: uppercase; font-weight: bold; letter-spacing: 2px; }
        .cart-btn { cursor: pointer; }
        .status { text-align: center; font-size: 11px; color: #666; margin: 10px 0; letter-spacing: 1px; text-transform: uppercase; }
        h1 { text-align: center; font-size: 14px; letter-spacing: 3px; margin: 20px 0; text-transform: uppercase; color: #111; }
        .categories { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .cat-btn { background: #f1f1f1; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: 0.2s; }
        .cat-btn.active, .cat-btn:hover { background: #000; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; padding: 0 40px 60px 40px; max-width: 1400px; margin: 0 auto; }
        .product-card { background: #f9f9f9; display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; }
        .product-card img { width: 100%; height: 280px; object-fit: contain; background: #fff; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
        .product-cat { font-size: 9px; text-transform: uppercase; color: #777; letter-spacing: 1px; margin-bottom: 5px; }
        .product-name { font-size: 11px; font-weight: bold; text-transform: uppercase; text-align: center; margin-bottom: 8px; letter-spacing: 1px; }
        .product-price { font-size: 12px; font-weight: bold; margin-bottom: 15px; }
        .add-btn { background: #000; color: #fff; border: none; width: 100%; padding: 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .add-btn:hover { background: #333; }
    </style>
</head>
<body>

    <header>
        <div>Primore Reps</div>
        <div class="cart-btn" onclick="toggleCart()">Koszyk (<span id="cart-count">0</span>)</div>
    </header>

    <div class="status" id="backend-status">Pobieranie produktów z API...</div>
    
    <h1>New Arrivals // Collection</h1>

    <div class="categories">
        <button class="cat-btn active" onclick="filterProducts('Wszystkie', this)">Wszystkie</button>
        <button class="cat-btn" onclick="filterProducts('Odzież', this)">Odzież</button>
        <button class="cat-btn" onclick="filterProducts('Biżuteria', this)">Biżuteria</button>
        <button class="cat-btn" onclick="filterProducts('Elektronika', this)">Elektronika</button>
        <button class="cat-btn" onclick="filterProducts('Inne', this)">Inne</button>
    </div>

    <div class="grid" id="product-grid"></div>

    <script>
        let allProducts = [];
        let cart = [];

        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                const data = await response.json();
                allProducts = data;
                
                document.getElementById('backend-status').innerText = "Status: Załadowano produkty z zewnętrznego API";
                displayProducts(allProducts);
            } catch (error) {
                document.getElementById('backend-status').innerText = "Błąd połączenia z backendem!";
                console.error("Błąd:", error);
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x280?text=Brak+Zdjecia'">
                    <div class="product-cat">${p.category}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price_pln} ZŁ</div>
                    <button class="add-btn" onclick="addToCart('${p.name}', ${p.price_pln})">Dodaj do koszyka</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (category === 'Wszystkie') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category.toLowerCase() === category.toLowerCase());
                displayProducts(filtered);
            }
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            document.getElementById('cart-count').innerText = cart.length;
        }

        function toggleCart() {
            if(cart.length === 0) {
                alert("Twój koszyk jest pusty.");
            } else {
                let itemsList = cart.map(item => `${item.name} - ${item.price} ZŁ`).join('\n');
                alert("Zawartość koszyka:\n\n" + itemsList);
            }
        }

        fetchProducts();
    </script>
</body>
</html>
